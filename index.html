<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue Template</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/axios@1.20.0/dist/axios.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="nav-bar"></div>

      <h1>{{ intro }}</h1>

      <button v-on:click="getAllPosts" >Hent alle posts</button>
      <br />
            <input v-model="postId" type="text" placeholder="Indtast post id" />
      <br>


    <button v-on:click="getOnePost" >Hent en post</button>

<br>


      <input v-model="userId" type="text" placeholder="Indtast user id" />
      <br>
      <input v-model="id" type="text" placeholder="Indtast id" />
      <br>
      <input v-model="title" type="text" placeholder="Indtast title" />
      <br>
      <input v-model="body" type="text" placeholder="Indtast body" />
      <br>
    <button v-on:click="addPost" >post en post</button>

      <ul>
        <li v-for="post in postslist" :key="post.id">
          title: {{ post.title }} - userid: {{ post.userId }} - id: {{ post.id }}
        </li>
      </ul>


    </div>

    <!-- Import App -->
    <script src="./js/main.js"></script>

    <!-- Mount App -->
    <script>
      const mountedApp = app.mount('#app')
    </script>
  </body>
</html>
